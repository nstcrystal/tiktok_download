    <meta name="description" content="Download TikTok & YouTube videos. Free online downloader - TikTok without watermark HD, YouTube video & audio MP3. Paste URL and download." />
    <meta name="keywords" content="TikTok downloader, YouTube downloader, download TikTok, download YouTube, TikTok no watermark, YouTube MP3" />
    <meta name="theme-color" content="#ffffff" />
    <title>Media Downloader - TikTok & YouTube | Tải video không logo & MP3</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
